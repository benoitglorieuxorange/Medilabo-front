<div class="login-page flex min-h-screen items-center justify-center px-4 py-10">
  <div class="login-card">

    <div class="login-header">
      <div class="login-logo" aria-hidden="true">💸</div>
      <h1 class="login-title">MediLabo Solutions</h1>
      <p class="login-subtitle">Connectez-vous à votre compte</p>
    </div>

    @if (errorMessage) {
      <div class="error-message" role="alert" aria-live="polite">
        <span class="error-icon" aria-hidden="true">⚠️</span>
        {{ errorMessage }}
      </div>
    }

    <form (ngSubmit)="onSubmit()" class="login-form" novalidate>
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="votre@email.com"
          required
          aria-required="true"
        />
      </div>
      <div class="form-group">
        <label for="password">Mot de passe</label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          placeholder="••••••••"
          required
          aria-required="true"
        />
      </div>
      <button type="submit" class="btn-login">Se connecter</button>
    </form>

  </div>
</div>
